<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="SixQuant">
  <!-- SixQuant mark: a monospace "6" whose tail sweeps into an ascending
       signal series. Accent blue + market green on the terminal dark surface. -->
  <rect width="64" height="64" rx="14" fill="#0A0F1C"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#2F81F7" stroke-opacity="0.28"/>
  <!-- the "6": an open ring with a rising lead-in stroke -->
  <path d="M34 14 C24 18 19 26 19 36 a11 11 0 1 0 22 0 c0 -6 -4.4 -11 -11 -11 c-5 0 -8.6 2.8 -10 6.4"
        fill="none" stroke="#2F81F7" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ascending signal bars rising out of the 6, last bar green = "up" -->
  <rect x="40" y="40" width="4" height="9"  rx="2" fill="#2F81F7"/>
  <rect x="46" y="34" width="4" height="15" rx="2" fill="#2F81F7"/>
  <rect x="52" y="26" width="4" height="23" rx="2" fill="#16C784"/>
</svg>
