name: Generate Copilot feed

on:
  workflow_dispatch:
  schedule:
    # GitHub cron lands hours late, so these aim at a fresh read before and after the ASX day.
    - cron: '30 20 * * 0-4'
    - cron: '0 3 * * 1-5'
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

# All data workflows push to main, so they queue rather than race each other.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r tools/copilot/requirements.txt
      - name: Generate analysis
        run: python tools/copilot/generate.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/copilot.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh Copilot feed"
          git pull --rebase origin main
          git push
