name: Update Stock Snapshot

on:
  schedule:
    # Stooq provides daily-close data. AEST = UTC+10.
    # 21:30 UTC = 07:30 AEST: morning — overnight US close available
    # 07:30 UTC = 17:30 AEST: evening — today's ASX close available
    # 11:30 UTC = 21:30 AEST: night wrap
    - cron: '30 21 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch stock snapshot
        id: fetch
        run: python scripts/fetch_stocks.py
        continue-on-error: true

      - name: Write feed heartbeat
        if: steps.fetch.outcome == 'success'
        run: |
          python -c "import json, datetime; json.dump({'feed': 'stocks', 'lastRun': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'status': 'ok'}, open('data/heartbeat-stocks.json', 'w'), indent=2)"

      - name: Commit and push if changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data/stocks-snapshot.json data/heartbeat-stocks.json || (
            git add data/stocks-snapshot.json data/heartbeat-stocks.json &&
            git commit -m "chore: update stocks snapshot [skip ci]" &&
            git push
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
