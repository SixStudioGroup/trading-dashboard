name: Update Stock Snapshot

# Retired from the schedule on 2026-11-01: Stooq was timing out on every symbol,
# the run still reported success, and nothing reads this file any more. The
# Stocks terminal uses data/asx-feed.json. Manual runs remain available.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # tzdata makes zoneinfo("Australia/Sydney") resolve deterministically
        # regardless of the runner's system tz database.
        run: pip install requests tzdata

      - name: Fetch stock snapshot
        id: fetch
        run: python scripts/fetch_stocks.py
        continue-on-error: true

      - name: Write feed heartbeat
        if: steps.fetch.outcome == 'success'
        run: |
          python -c "import json, datetime; json.dump({'feed': 'stocks', 'lastRun': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'status': 'ok'}, open('data/heartbeat-stocks.json', 'w'), indent=2)"

      - name: Commit and push if changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data/stocks-snapshot.json data/heartbeat-stocks.json || (
            git add data/stocks-snapshot.json data/heartbeat-stocks.json &&
            git commit -m "chore: update stocks snapshot [skip ci]" &&
            git push
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
