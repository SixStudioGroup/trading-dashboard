name: Checks

# Runs on every pull request and push to main. A broken workflow file stopped
# the crypto feed for months unnoticed, so workflow YAML is parsed here too.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Parse workflow files
        run: |
          pip install pyyaml
          python -c "import glob,yaml;[yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')];print('workflow YAML ok')"
      - name: Core tests
        run: node scripts/test_core.mjs
      - name: Signal tests
        run: |
          pip install requests tzdata
          python scripts/test_signals.py
