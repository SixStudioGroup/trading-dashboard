name: Generate ASX delayed feed

on:
  workflow_dispatch:
  schedule:
    # ASX market-cycle windows. GitHub cron is UTC. AEST = UTC+10.
    # 00:00 UTC = 10:00 AEST: market open
    # 03:00 UTC = 13:00 AEST: midday session
    # 06:15 UTC = 16:15 AEST: post-close delayed-data capture
    - cron: '0 0 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '15 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: asx-delayed-feed
  cancel-in-progress: false

jobs:
  generate-asx-feed:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate provider-backed ASX feed
        run: node tools/generate-asx-feed.mjs

      - name: Commit ASX feed snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: refresh ASX delayed feed'
          file_pattern: data/asx-feed.json
