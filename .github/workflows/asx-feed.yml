name: Generate ASX delayed feed

on:
  workflow_dispatch:
  schedule:
    # ASX market-cycle windows. GitHub cron is UTC. AEST = UTC+10.
    # 00:00 UTC = 10:00 AEST: market open
    # 03:00 UTC = 13:00 AEST: midday session
    # 06:15 UTC = 16:15 AEST: post-close delayed-data capture
    - cron: '0 0 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '15 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: asx-delayed-feed
  cancel-in-progress: false

jobs:
  generate-asx-feed:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Generate provider-backed ASX feed
        run: node tools/generate-asx-feed.mjs

      - name: Write feed heartbeat
        run: node -e "require('fs').writeFileSync('data/heartbeat-asx.json', JSON.stringify({ feed: 'asx', lastRun: new Date().toISOString(), status: 'ok' }, null, 2) + '\n')"

      - name: Commit ASX feed snapshot
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: 'data: refresh ASX delayed feed'
          file_pattern: 'data/asx-feed.json data/heartbeat-asx.json'
