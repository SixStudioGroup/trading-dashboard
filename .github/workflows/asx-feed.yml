name: Generate ASX delayed feed

on:
  workflow_dispatch:
  schedule:
    # ASX market-cycle refresh windows. GitHub cron is UTC.
    # 00:15 UTC = 10:15 AEST / 11:15 AEDT: post-open stabilisation window.
    # 02:00 UTC = 12:00 AEST / 13:00 AEDT: midday liquidity window.
    # 04:00 UTC = 14:00 AEST / 15:00 AEDT: afternoon trend window.
    # 06:15 UTC = 16:15 AEST / 17:15 AEDT: post-close delayed-data capture.
    - cron: '15 0 * * 1-5'
    - cron: '0 2 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '15 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: asx-delayed-feed
  cancel-in-progress: false

jobs:
  generate-asx-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate provider-backed ASX feed
        run: node tools/generate-asx-feed.mjs

      - name: Commit ASX feed snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: refresh ASX delayed feed'
          file_pattern: data/asx-feed.json
