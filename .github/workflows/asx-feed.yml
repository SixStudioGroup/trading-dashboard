name: Generate ASX delayed feed

on:
  workflow_dispatch:
  schedule:
    # ASX market-cycle windows. GitHub cron is UTC. AEST = UTC+10.
    # 00:00 UTC = 10:00 AEST: market open
    # 03:00 UTC = 13:00 AEST: midday session
    # 06:15 UTC = 16:15 AEST: post-close delayed-data capture
    - cron: '0 0 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '15 6 * * 1-5'

permissions:
  contents: write
  issues: write          # failure alerting opens/updates a tracking issue

concurrency:
  group: asx-delayed-feed
  cancel-in-progress: false

jobs:
  generate-asx-feed:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The generator validates the feed and writes data/heartbeat-asx.json with
      # status ok | degraded | failed. On validation failure it exits non-zero and
      # refuses to overwrite the last-good data/asx-feed.json. We let the job
      # continue so the degraded heartbeat is still committed and the failure is
      # alerted, instead of the run silently going red with no UI signal.
      - name: Generate provider-backed ASX feed
        id: generate
        run: node tools/generate-asx-feed.mjs
        continue-on-error: true

      # Commit whatever changed: the refreshed feed (only written on success) and
      # the heartbeat (always written — ok/degraded/failed). The committed
      # heartbeat is what the Stocks terminal reads to flag a missed/unhealthy run.
      - name: Commit ASX feed snapshot and heartbeat
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: 'data: refresh ASX delayed feed'
          file_pattern: 'data/asx-feed.json data/heartbeat-asx.json'

      # Surface a scheduled-run failure as an issue using the default token only.
      # Opens a tracking issue on first failure and comments on the existing open
      # one thereafter, so repeated failures don't spam new issues.
      - name: Alert on feed failure
        if: steps.generate.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const title = 'ASX delayed-feed run failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled ASX delayed-feed generator exited non-zero (validation or fetch failure).`,
              ``,
              `The last-good \`data/asx-feed.json\` was NOT overwritten; \`data/heartbeat-asx.json\` is now \`degraded\`/\`failed\` and the Stocks terminal surfaces a pipeline warning.`,
              ``,
              `Run: ${runUrl}`,
              `Time: ${new Date().toISOString()}`
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'feed-failure', per_page: 10
            });
            const open = existing.data.find(i => i.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['feed-failure']
              });
            }

      # Make the job itself red so the failure is visible in the Actions UI too.
      - name: Fail the job if the generator failed
        if: steps.generate.outcome == 'failure'
        run: |
          echo "ASX feed generation failed — see the feed-failure issue and heartbeat."
          exit 1
