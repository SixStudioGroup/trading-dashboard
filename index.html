<!DOCTYPE html>
<html>
<head>
    <title>Live Trading Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 40px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 25px; border-radius: 12px; max-width: 400px; }
        h1 { margin-top: 0; color: #fff; }
        .data-point { font-size: 1.2em; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Dashboard</h1>
        <div id="status">Loading data...</div>
    </div>
    <script>
        fetch("data.json")
            .then(response => response.json())
            .then(data => {
                document.getElementById("status").innerHTML = `
                    <p class="data-point">Asset: ${data.active_asset}</p>
                    <p class="data-point">Status: ${data.status}</p>
                    <p class="data-point">Signal: <strong>${data.trade_recommendation}</strong></p>
                `;
            });
    </script>
</body>
</html>
