<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenCloud Day Trading Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        nav {
            background: #111;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        nav a {
            color: #00ff9d;
            margin: 0 20px;
            text-decoration: none;
            font-weight: 500;
        }
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
        }
        h1 { color: #00ff9d; margin: 0; font-size: 2.6rem; }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 24px;
        }
        .card {
            background: #111;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #222;
        }
        .coin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .symbol { font-size: 1.4rem; font-weight: 600; }
        .price { font-size: 2.2rem; font-weight: 700; }
        .positive { color: #00ff9d; }
        .negative { color: #ff3b5c; }
        .signal {
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 8px;
            display: inline-block;
        }
        .buy { background: #004d2e; color: #00ff9d; }
        .wait { background: #4d4d00; color: #ffcc00; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="logs.html">Trade Logs</a>
        <a href="#">Scanner</a>
        <a href="#">Watchlist</a>
    </nav>

    <div class="header">
        <h1>ZenCloud Day Trading Dashboard</h1>
        <p id="last-updated" style="color:#888;">Last Updated: Loading...</p>
    </div>

    <div class="container" id="coins-container">
        <!-- Cards will be added by JavaScript -->
    </div>

    <script>
        fetch("data.json")
            .then(r => r.json())
            .then(data => {
                document.getElementById("last-updated").textContent = 
                    "Last Updated: " + new Date(data.last_updated).toLocaleString('en-AU');

                const container = document.getElementById("coins-container");
                container.innerHTML = "";

                data.coins.forEach(coin => {
                    const changeClass = coin.change_24h >= 0 ? "positive" : "negative";
                    const signalClass = coin.signal === "BUY" ? "buy" : "wait";

                    const cardHTML = `
                        <div class="card">
                            <div class="coin-header">
                                <div class="symbol">${coin.symbol}</div>
                                <div class="${changeClass}">${coin.change_24h >= 0 ? '+' : ''}${coin.change_24h}%</div>
                            </div>
                            <div class="price">$${coin.price.toLocaleString()}</div>
                            <div style="margin: 12px 0;">
                                Trend: <strong>${coin.trend}</strong>
                            </div>
                            <div>
                                Signal: <span class="signal ${signalClass}">${coin.signal}</span>
                            </div>
                            <div style="margin-top: 12px; color:#aaa;">
                                Volume: ${coin.volume}
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById("last-updated").textContent = "Error loading data";
            });
    </script>
</body>
</html>
