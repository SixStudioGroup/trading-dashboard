<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenCloud Terminal • CoinSpot Companion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        :root {
            --primary: #00ff9d;
            --bg: #050505;
            --card: #0f0f0f;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        nav {
            background: rgba(10,10,10,0.98);
            backdrop-filter: blur(12px);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        nav a {
            color: #ccc;
            margin-left: 28px;
            text-decoration: none;
            font-weight: 500;
        }
        nav a:hover { color: var(--primary); }

        .header {
            padding: 40px 40px 20px;
            text-align: center;
            background: linear-gradient(#0a0a0a, #050505);
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.9rem;
            margin: 0;
        }
        .balance {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">ZEN CLOUD</div>
        <div>
            <a href="index.html">Terminal</a>
            <a href="logs.html">Trade Logs</a>
            <a href="alerts.html">Alerts</a>
            <a href="watchlist.html">Watchlist</a>
        </div>
    </nav>

    <div class="header">
        <h1>Day Trading Terminal</h1>
        <p style="color:#777; margin:8px 0 0;">CoinSpot Companion • Real-time Momentum Scanner</p>
        <div class="balance" id="total-balance">$0.00 AUD</div>
        <p id="last-updated" style="color:#555;">Last Updated: Loading...</p>
    </div>

    <div style="max-width: 1680px; margin: 0 auto; padding: 0 40px 60px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
        <!-- Main Watchlist -->
        <div id="watchlist" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 22px;"></div>

        <!-- Side Panel -->
        <div>
            <div style="background:#0f0f0f; border:1px solid #222; border-radius:16px; padding:24px; margin-bottom:24px;">
                <h3 style="color:#00ff9d; margin-top:0;">🚀 Top Gainers</h3>
                <div id="gainers"></div>
            </div>
            <div style="background:#0f0f0f; border:1px solid #222; border-radius:16px; padding:24px;">
                <h3 style="color:#ff3b5c; margin-top:0;">🔻 Top Losers</h3>
                <div id="losers"></div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        function loadDashboard() {
            const data = window.dashboardData;
            document.getElementById("last-updated").textContent = 
                "Last Updated: " + new Date(data.last_updated).toLocaleString('en-AU');

            // Total Balance (fake for now)
            document.getElementById("total-balance").textContent = "$248.65 AUD";

            const watchlistEl = document.getElementById("watchlist");
            watchlistEl.innerHTML = "";

            data.coins.forEach(coin => {
                const isPos = coin.change_24h >= 0;
                const html = `
                    <div style="background:#0f0f0f; border:1px solid #222; border-radius:16px; padding:24px; transition:all 0.3s;">
                        <div style="font-size:1.4rem; font-weight:600;">${coin.symbol}/AUD</div>
                        <div style="font-size:2.4rem; font-weight:700; margin:12px 0;">$${Number(coin.price).toLocaleString()}</div>
                        <div style="font-size:1.2rem; color:${isPos ? '#00ff9d' : '#ff3b5c'};">${isPos ? '+' : ''}${coin.change_24h}%</div>
                        <div style="margin:12px 0;">Signal: <strong style="color:${coin.signal==='BUY'?'#00ff9d':'#ffd700'}">${coin.signal}</strong></div>
                        <a href="https://www.coinspot.com.au/buy/${coin.symbol.toLowerCase()}" target="_blank" 
                           style="background:#00ff9d; color:black; padding:12px 24px; border-radius:9999px; text-decoration:none; display:inline-block; margin-top:12px; font-weight:600;">
                            TRADE ON COINSPOT →
                        </a>
                    </div>
                `;
                watchlistEl.innerHTML += html;
            });
        }

        loadDashboard();
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
